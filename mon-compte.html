<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Mon espace — Barbe-À-Ras</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C96B;--gold3:rgba(201,168,76,0.12);--gold4:rgba(201,168,76,0.35);
  --black:#080808;--charcoal:#131313;--white:#F5F0E8;--dim:rgba(245,240,232,0.65);
  --dim2:rgba(245,240,232,0.35);--red:#e74c3c;--green:#27ae60;
}
body{font-family:'Barlow',sans-serif;background:var(--black);color:var(--white);min-height:100vh}
nav{height:64px;display:flex;align-items:center;justify-content:space-between;
  padding:0 2rem;background:rgba(8,8,8,0.97);border-bottom:1px solid var(--gold4);
  position:sticky;top:0;z-index:100}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;
  color:var(--gold);text-decoration:none}
.nav-right{display:flex;align-items:center;gap:1rem}
.nav-user{font-size:0.8rem;color:var(--dim2)}
.btn-deconnect{background:none;border:1px solid var(--gold4);color:var(--dim2);
  padding:0.35rem 0.9rem;font-size:0.72rem;letter-spacing:1px;cursor:pointer;
  font-family:'Barlow',sans-serif;text-transform:uppercase;transition:all 0.2s}
.btn-deconnect:hover{border-color:var(--red);color:var(--red)}

.page{max-width:860px;margin:0 auto;padding:2rem 1.5rem}

/* Header profil */
.profile-header{display:flex;align-items:center;gap:1.5rem;
  background:var(--charcoal);border:1px solid var(--gold4);
  padding:1.5rem;margin-bottom:2rem;position:relative;overflow:hidden}
.profile-header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold)}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--gold3);
  border:2px solid var(--gold4);display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--gold);flex-shrink:0}
.profile-info h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;margin-bottom:0.2rem}
.profile-info p{font-size:0.8rem;color:var(--dim2)}


/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--gold4);margin-bottom:1.5rem;overflow-x:auto}
.tab-btn{padding:0.7rem 1.2rem;background:none;border:none;color:var(--dim2);
  font-family:'Barlow',sans-serif;font-size:0.75rem;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;transition:all 0.2s;
  border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-content{display:none}
.tab-content.active{display:block}

/* Cards RDV */
.rdv-card{background:var(--charcoal);border:1px solid var(--gold4);
  padding:1.2rem;margin-bottom:0.8rem;position:relative}
.rdv-card.upcoming::before{content:'';position:absolute;top:0;left:0;
  bottom:0;width:3px;background:var(--green)}
.rdv-card.past::before{content:'';position:absolute;top:0;left:0;
  bottom:0;width:3px;background:var(--gold4)}
.rdv-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.6rem}
.rdv-date{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px;color:var(--gold)}
.rdv-badge{font-size:0.65rem;letter-spacing:1px;padding:0.2rem 0.5rem;text-transform:uppercase}
.badge-confirme{background:rgba(39,174,96,0.1);color:var(--green);border:1px solid rgba(39,174,96,0.3)}
.badge-annule{background:rgba(231,76,60,0.1);color:var(--red);border:1px solid rgba(231,76,60,0.3)}
.badge-passe{background:rgba(245,240,232,0.05);color:var(--dim2);border:1px solid var(--gold4)}
.rdv-details{display:flex;gap:2rem;flex-wrap:wrap;font-size:0.83rem;color:var(--dim)}
.rdv-details span{display:flex;align-items:center;gap:0.3rem}
.rdv-actions{display:flex;gap:0.5rem;margin-top:0.8rem;flex-wrap:wrap}
.btn-sm-gold{background:var(--gold3);color:var(--gold);border:1px solid var(--gold4);
  padding:0.4rem 0.9rem;font-size:0.72rem;font-family:'Barlow',sans-serif;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-decoration:none;
  transition:all 0.2s;display:inline-block}
.btn-sm-gold:hover{background:rgba(201,168,76,0.2)}
.btn-sm-red{background:rgba(231,76,60,0.08);color:var(--red);border:1px solid rgba(231,76,60,0.3);
  padding:0.4rem 0.9rem;font-size:0.72rem;font-family:'Barlow',sans-serif;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
.btn-sm-red:hover{background:rgba(231,76,60,0.15)}

/* Profil edit */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.field-group label{display:block;font-size:0.68rem;letter-spacing:2px;
  text-transform:uppercase;color:var(--dim2);margin-bottom:0.4rem}
.field-group input{width:100%;background:rgba(245,240,232,0.04);border:1px solid var(--gold4);
  color:var(--white);font-family:'Barlow',sans-serif;font-size:0.88rem;
  padding:0.7rem 0.9rem;outline:none;transition:border-color 0.2s}
.field-group input:focus{border-color:var(--gold)}
.field-group input:disabled{opacity:0.5;cursor:not-allowed}
.btn-save{background:var(--gold);color:var(--black);border:none;
  padding:0.8rem 2rem;font-family:'Barlow',sans-serif;font-size:0.82rem;
  font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.btn-save:hover{background:var(--gold2)}

/* Avis */
.avis-card{background:var(--charcoal);border:1px solid var(--gold4);padding:1.2rem;margin-bottom:0.8rem}
.avis-stars{font-size:1.1rem;letter-spacing:2px;margin-bottom:0.4rem}
.avis-comment{font-size:0.85rem;color:var(--dim);font-style:italic;margin-bottom:0.4rem}
.avis-meta{font-size:0.72rem;color:var(--dim2)}
.btn-sm-avis{background:rgba(201,168,76,0.08);color:var(--gold);border:1px solid var(--gold4);
  padding:0.4rem 0.9rem;font-size:0.72rem;font-family:"Barlow",sans-serif;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
.btn-sm-avis:hover{background:var(--gold3)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:1rem;display:none}
.modal-box{background:var(--charcoal);border:1px solid var(--gold4);
  max-width:440px;width:100%;padding:2rem;position:relative}
.modal-box::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold)}
.modal-close{position:absolute;top:0.8rem;right:0.8rem;background:none;border:none;
  color:var(--dim2);font-size:1.2rem;cursor:pointer}
.modal-close:hover{color:var(--white)}
.star-pick{display:flex;justify-content:center;gap:0.6rem;margin:1rem 0}
.star-pick span{font-size:2.2rem;cursor:pointer;filter:grayscale(1);opacity:0.3;transition:all 0.15s;user-select:none}
.star-pick span.on{filter:none;opacity:1;transform:scale(1.1)}
.modal-textarea{width:100%;background:rgba(245,240,232,0.04);border:1px solid var(--gold4);
  color:var(--white);font-family:"Barlow",sans-serif;font-size:0.87rem;
  padding:0.8rem;resize:none;height:90px;outline:none;margin-bottom:1rem}
.modal-textarea:focus{border-color:var(--gold)}



/* Empty state */
.empty{text-align:center;padding:3rem;color:var(--dim2);font-size:0.85rem}
.empty-icon{font-size:2.5rem;margin-bottom:0.8rem}
.spinner{width:32px;height:32px;border:2px solid var(--gold4);border-top-color:var(--gold);
  border-radius:50%;animation:spin 0.8s linear infinite;margin:2rem auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--charcoal);
  border:1px solid var(--gold4);border-left:3px solid var(--green);
  padding:0.8rem 1.2rem;font-size:0.82rem;z-index:999;
  animation:fadeIn 0.3s ease;display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">✂ BARBE-À-RAS</a>
  <div class="nav-right">
    <span class="nav-user" id="nav-user-name"></span>
    <button class="btn-deconnect" onclick="deconnecter()">Déconnexion</button>
  </div>
</nav>

<div class="page">
  <div id="loading" style="text-align:center;padding:4rem">
    <div class="spinner"></div>
  </div>

  <div id="main-content" style="display:none">
    <!-- Header profil -->
    <div class="profile-header">
      <div class="avatar" id="avatar-initiales">?</div>
      <div class="profile-info">
        <h2 id="profil-nom">—</h2>
        <p id="profil-email">—</p>
        <p id="profil-tel" style="margin-top:2px">—</p>
      </div>

    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('rdv')">📅 Mes RDV</button>
      <button class="tab-btn" onclick="switchTab('historique')">📋 Historique</button>
      <button class="tab-btn" onclick="switchTab('profil')">👤 Mon profil</button>
      <button class="tab-btn" onclick="switchTab('avis')">⭐ Mes avis</button>

    </div>

    <!-- TAB: RDV À VENIR -->
    <div class="tab-content active" id="tab-rdv">
      <div id="rdv-upcoming-list"></div>
      <div style="margin-top:1.5rem;text-align:center">
        <a href="booking.html" style="background:var(--gold);color:var(--black);
          padding:0.9rem 2rem;font-weight:700;letter-spacing:2px;text-decoration:none;
          font-size:0.82rem;text-transform:uppercase;display:inline-block">
          + Prendre un nouveau RDV
        </a>
      </div>
    </div>

    <!-- TAB: HISTORIQUE -->
    <div class="tab-content" id="tab-historique">
      <div id="rdv-history-list"></div>
    </div>

    <!-- TAB: MON PROFIL -->
    <div class="tab-content" id="tab-profil">
      <div style="background:var(--charcoal);border:1px solid var(--gold4);padding:1.5rem">
        <h3 style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:2px;
          color:var(--gold);margin-bottom:1.2rem">Informations personnelles</h3>
        <div class="form-grid">
          <div class="field-group">
            <label>Prénom</label>
            <input type="text" id="edit-prenom">
          </div>
          <div class="field-group">
            <label>Nom</label>
            <input type="text" id="edit-nom">
          </div>
        </div>
        <div class="field-group" style="margin-bottom:1rem">
          <label>Téléphone</label>
          <input type="tel" id="edit-tel">
        </div>
        <div class="field-group" style="margin-bottom:1.2rem">
          <label>Courriel</label>
          <input type="email" id="edit-email" disabled>
          <div style="font-size:0.72rem;color:var(--dim2);margin-top:4px">Le courriel ne peut pas être modifié</div>
        </div>
        <button class="btn-save" onclick="sauvegarderProfil()">Sauvegarder</button>
      </div>
    </div>

    <!-- TAB: MES AVIS -->
    <div class="tab-content" id="tab-avis">
      <div id="avis-list"></div>
    </div>

  </div>
</div>

<!-- MODAL AVIS -->
<div class="modal-overlay" id="modal-avis" onclick="if(event.target===this)fermerModalAvis()">
  <div class="modal-box">
    <button class="modal-close" onclick="fermerModalAvis()">✕</button>
    <h3 style="font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px;color:var(--gold);margin-bottom:0.3rem">Laisser un avis</h3>
    <p id="modal-avis-rdv" style="font-size:0.78rem;color:var(--dim2);margin-bottom:0.5rem"></p>
    <div class="star-pick" id="star-pick">
      <span onclick="setStarPick(1)">⭐</span>
      <span onclick="setStarPick(2)">⭐</span>
      <span onclick="setStarPick(3)">⭐</span>
      <span onclick="setStarPick(4)">⭐</span>
      <span onclick="setStarPick(5)">⭐</span>
    </div>
    <p id="star-desc" style="text-align:center;font-size:0.78rem;color:var(--gold);height:1rem;margin-bottom:0.8rem"></p>
    <textarea class="modal-textarea" id="modal-commentaire" placeholder="Votre commentaire (optionnel)..."></textarea>
    <button class="btn-save" style="width:100%" onclick="soumettreAvis()">★ Envoyer mon avis</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://uqohxkpxcamrqlmuxaae.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxb2h4a3B4Y2FtcnFsbXV4YWFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODcwMTgsImV4cCI6MjA5Mjk2MzAxOH0.AtV-__Hz6bCqeizWIpEVHR2OomIfbJANyJWJej7BopQ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let clientData = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 3000);
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    const tabs = ['rdv','historique','profil','avis'];
    b.classList.toggle('active', tabs[i]===name);
  });
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
}

async function init() {
  const {data:{session}} = await sb.auth.getSession();
  if(!session) { window.location.href = '/compte.html'; return; }

  // Chercher le client par auth_user_id
  let {data:client} = await sb.from('clients')
    .select('*').eq('auth_user_id', session.user.id).maybeSingle();

  // Fallback : chercher par email si auth_user_id pas encore lié
  if(!client) {
    const {data:byEmail} = await sb.from('clients')
      .select('*').eq('email', session.user.email).maybeSingle();
    if(byEmail) {
      await sb.from('clients').update({auth_user_id: session.user.id}).eq('id', byEmail.id);
      client = byEmail;
    }
  }

  // Créer un profil minimal si introuvable
  if(!client) {
    const meta = session.user.user_metadata || {};
    const {data:newClient} = await sb.from('clients').insert({
      prenom: meta.prenom || session.user.email.split('@')[0],
      nom: meta.nom || '',
      telephone: meta.tel || '',
      email: session.user.email,
      auth_user_id: session.user.id
    }).select().single();
    client = newClient;
  }

  if(!client) { window.location.href = '/compte.html'; return; }
  clientData = client;

  const initiales = ((client.prenom||'?')[0] + (client.nom||'?')[0]).toUpperCase();
  document.getElementById('avatar-initiales').textContent = initiales;
  document.getElementById('profil-nom').textContent = `${client.prenom||''} ${client.nom||''}`.trim();
  document.getElementById('profil-email').textContent = session.user.email;
  document.getElementById('profil-tel').textContent = client.telephone ? `📞 ${client.telephone}` : '';
  document.getElementById('nav-user-name').textContent = client.prenom||'';
  document.getElementById('edit-prenom').value = client.prenom||'';
  document.getElementById('edit-nom').value = client.nom||'';
  document.getElementById('edit-tel').value = client.telephone||'';
  document.getElementById('edit-email').value = session.user.email||'';

  await Promise.all([loadRDV(), loadAvis()]);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
}

async function loadRDV() {
  const today = new Date().toLocaleDateString('en-CA',{timeZone:'America/Toronto'});
  const {data:resas} = await sb.from('reservations').select('*')
    .eq('client_id', clientData.id).order('date_rdv',{ascending:false});
  const upcoming = (resas||[]).filter(r=>r.date_rdv>=today&&r.statut==='confirmé');
  const history  = (resas||[]).filter(r=>r.date_rdv<today||r.statut==='annulé');

  const upEl = document.getElementById('rdv-upcoming-list');
  upEl.innerHTML = !upcoming.length
    ? `<div class="empty"><div class="empty-icon">📅</div><p>Aucun rendez-vous à venir</p></div>`
    : upcoming.map(r=>{
        const dl = new Date(r.date_rdv+'T12:00:00').toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
        const canCancel = (new Date(r.date_rdv+'T'+r.heure_rdv+'-04:00')-new Date())>3*60*60*1000;
        return `<div class="rdv-card upcoming">
          <div class="rdv-header"><div class="rdv-date">${dl}</div><span class="rdv-badge badge-confirme">Confirmé</span></div>
          <div class="rdv-details">
            <span>🕐 ${r.heure_rdv?.substring(0,5)}</span><span>✂ ${r.barbier}</span>
            <span>💈 ${r.service}</span><span style="color:var(--gold)">💰 ${r.prix}</span>
          </div>
          ${r.cancel_token?`<div class="rdv-actions">
            <a href="/modify?token=${r.cancel_token}&id=${r.id}" class="btn-sm-gold">✏️ Modifier</a>
            ${canCancel?`<a href="/cancel?token=${r.cancel_token}&id=${r.id}" class="btn-sm-red">✕ Annuler</a>`:''}
          </div>`:''}
        </div>`;
      }).join('');

  // Charger les avis déjà donnés pour cacher le bouton
  const {data:avisExist} = await sb.from('avis').select('reservation_id').eq('client_id',clientData.id);
  const avisIds = new Set((avisExist||[]).map(a=>a.reservation_id));

  const histEl = document.getElementById('rdv-history-list');
  histEl.innerHTML = !history.length
    ? `<div class="empty"><div class="empty-icon">📋</div><p>Aucun historique</p></div>`
    : history.slice(0,20).map(r=>{
        const dl = new Date(r.date_rdv+'T12:00:00').toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
        const bc = r.statut==='annulé'?'badge-annule':'badge-passe';
        const bl = r.statut==='annulé'?'Annulé':'Complété';
        const dejaAvis = avisIds.has(r.id);
        const peutAvis = r.statut!=='annulé' && !dejaAvis;
        return `<div class="rdv-card past" id="rdv-${r.id}">
          <div class="rdv-header"><div class="rdv-date">${dl}</div><span class="rdv-badge ${bc}">${bl}</span></div>
          <div class="rdv-details">
            <span>🕐 ${r.heure_rdv?.substring(0,5)}</span><span>✂ ${r.barbier}</span>
            <span>💈 ${r.service}</span><span style="color:var(--gold)">💰 ${r.prix}</span>
          </div>
          ${peutAvis ? `<div class="rdv-actions"><button class="btn-sm-avis" onclick="ouvrirModalAvis('${r.id}','${r.barbier}','${dl}')">⭐ Laisser un avis</button></div>` : ''}
          ${dejaAvis ? '<div style="font-size:0.72rem;color:var(--gold);margin-top:0.5rem">✅ Avis donné</div>' : ''}
        </div>`;
      }).join('');
}

async function loadAvis() {
  const {data:avisList} = await sb.from('avis').select('*')
    .eq('client_id', clientData.id).order('created_at',{ascending:false});
  const el = document.getElementById('avis-list');
  if(!avisList||!avisList.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">⭐</div><p>Vous n'avez pas encore laissé d'avis</p></div>`;
    return;
  }
  const st = n=>'⭐'.repeat(n)+'☆'.repeat(5-n);
  el.innerHTML = avisList.map(a=>`
    <div class="avis-card">
      <div class="avis-stars">${st(a.note)}</div>
      <div style="font-size:0.82rem;color:var(--gold);margin-bottom:0.3rem">✂ ${a.barbier}</div>
      ${a.commentaire?`<div class="avis-comment">"${a.commentaire}"</div>`:''}
      <div class="avis-meta">${new Date(a.created_at).toLocaleDateString('fr-CA',{day:'numeric',month:'long',year:'numeric'})}</div>
    </div>`).join('');
}

async function sauvegarderProfil() {
  const prenom = document.getElementById('edit-prenom').value.trim();
  const nom    = document.getElementById('edit-nom').value.trim();
  const tel    = document.getElementById('edit-tel').value.trim();
  if(!prenom||!nom) { showToast('Prénom et nom obligatoires'); return; }
  await sb.from('clients').update({prenom,nom,telephone:tel.replace(/\D/g,'')}).eq('id',clientData.id);
  document.getElementById('profil-nom').textContent = `${prenom} ${nom}`;
  document.getElementById('avatar-initiales').textContent = (prenom[0]+nom[0]).toUpperCase();
  showToast('✅ Profil mis à jour');
}

async function deconnecter() {
  await sb.auth.signOut();
  window.location.href = '/compte.html';
}

// ── MODAL AVIS ──
let _modalResaId = null;
let _modalNote = 0;
const STAR_LABELS = ['','Mauvais 😞','Passable 😐','Bien 🙂','Très bien 😊','Excellent ! 🤩'];

function ouvrirModalAvis(resaId, barbier, dateLabel) {
  _modalResaId = resaId;
  _modalNote = 0;
  document.getElementById('modal-avis-rdv').textContent = barbier + ' · ' + dateLabel;
  document.getElementById('modal-commentaire').value = '';
  document.getElementById('star-desc').textContent = '';
  document.querySelectorAll('.star-pick span').forEach(s=>s.classList.remove('on'));
  document.getElementById('modal-avis').style.display = 'flex';
}

function fermerModalAvis() {
  document.getElementById('modal-avis').style.display = 'none';
  _modalResaId = null; _modalNote = 0;
}

function setStarPick(n) {
  _modalNote = n;
  document.querySelectorAll('.star-pick span').forEach((s,i)=>s.classList.toggle('on',i<n));
  document.getElementById('star-desc').textContent = STAR_LABELS[n];
}

async function soumettreAvis() {
  if(!_modalNote) { showToast('Choisissez une note'); return; }
  const commentaire = document.getElementById('modal-commentaire').value.trim() || null;
  const {error} = await sb.from('avis').insert({
    reservation_id: _modalResaId,
    client_id: clientData.id,
    barbier: document.getElementById('modal-avis-rdv').textContent.split(' · ')[0],
    note: _modalNote,
    commentaire,
    afficher: true
  });
  if(error) { showToast('Erreur — réessayez'); return; }
  fermerModalAvis();
  showToast('✅ Merci pour votre avis !');
  // Mettre à jour la carte RDV
  const rdvEl = document.getElementById('rdv-'+_modalResaId);
  if(rdvEl) {
    rdvEl.querySelector('.btn-sm-avis')?.remove();
    const div = document.createElement('div');
    div.style.cssText = 'font-size:0.72rem;color:var(--gold);margin-top:0.5rem';
    div.textContent = '✅ Avis donné';
    rdvEl.appendChild(div);
  }
  loadAvis();
}

init();
</script>
</body>
</html>
